name: Build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and DMG
        run: ./build.sh --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: VYSHYVKA-BAR-dmg
          path: dist/*.dmg
